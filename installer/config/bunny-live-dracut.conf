# Dracut modules the installer medium's initramfs must contain.
#
# Read by dracut from /usr/lib/dracut/dracut.conf.d/95-bunny-live.conf. The
# number matters: the fedora-bootc base ships 01 through 59 in that directory,
# every one of them using `add_dracutmodules+=`, and dracut reads the directory
# in sorted order. 95 lands after all of them, so this file adds to the base's
# set rather than racing it.
#
# ## Why the medium needs these and did not have them
#
# The initramfs the base image ships was generated with `--add ostree` and
# nothing else. Measured against the artifact that reached the ISO:
#
#     lsinitrd --mod images/pxeboot/initrd.img | grep -x dmsquash-live  -> absent
#     lsinitrd --mod images/pxeboot/initrd.img | grep -x livenet        -> absent
#     lsinitrd --mod images/pxeboot/initrd.img | grep -x ostree         -> present
#
# `root=live:CDLABEL=…` is parsed by dmsquash-live and by nothing else. With the
# module absent nothing consumed the argument, no root was ever assembled, and
# `initrd-switch-root.service` failed — which is the only thing the first boot of
# this medium ever showed on screen. An earlier `inst.stage2=` command line
# failed for the mirror-image reason: it is read by anaconda-dracut, which is not
# in this initramfs either and is not wanted, because image-builder produces a
# LiveOS ISO and not an Anaconda boot.iso.
#
# ## Each module, and why it is here
#
#   dmsquash-live  Parses `root=live:CDLABEL=<label>`, resolves it to
#                  /dev/disk/by-label/<label>, mounts /LiveOS/squashfs.img from
#                  the medium and assembles the root the initramfs switches to.
#                  This is the module whose absence caused the failure.
#
#   livenet        image-builder names it in its own statement of what a bootc
#                  container initramfs requires ("bootc container initramfs
#                  requires ostree, dmsquash-live and livenet modules"). It is
#                  what serves `root=live:http(s)://…`; the CDLABEL path here
#                  does not exercise it, and it is present because the medium is
#                  built to image-builder's contract rather than to the subset
#                  this one command line happens to reach.
#
#   ostree         The base already adds it via 20-bootc-base.conf. Restated so
#                  this file names the whole required set rather than a delta
#                  against a base configuration Bunny does not own — if the base
#                  drops it, the build fails here instead of on a screen.
#
# Nothing else is requested. `overlayfs`, `dm`, `img-lib`, `rootfs-block` and
# `initqueue` arrive as dmsquash-live's declared dependencies, and `qemu`,
# `qemu-net` and `kernel-modules` were already in the shipped initramfs before
# this file existed — asking for them again would be decoration. What matters is
# that they are *verified* afterwards, which build/scripts/check-live-initramfs.py
# does against the generated artifact.
add_dracutmodules+=" dmsquash-live livenet ostree "

# dmsquash-live refuses a host-only build outright — its own check() is
# `[[ ${hostonly-} ]] && return 1` — and 01-dist.conf sets hostonly="yes".
# 02-generic-image.conf and 20-bootc-base.conf already turn it off; this repeats
# it at 95 so the setting cannot be reintroduced by a file sorting between them
# and this one. A host-only initramfs built inside a container would also record
# the container's idea of the hardware, which is nobody's.
hostonly="no"
