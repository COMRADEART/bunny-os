# Dracut modules the installer medium's initramfs must contain.
#
# image-builder states the requirement itself, in as many words — the string is
# in its binary:
#
#     bootc container initramfs requires ostree, dmsquash-live and livenet modules
#     add_dracutmodules+=" qemu qemu-net livenet dmsquash-live "
#     * Rebuild the initramfs so that it includes the dmsquash-live module
#
# Without them the ISO boots its kernel, the initramfs finds no root to switch
# to, and `initrd-switch-root.service` fails into a dracut emergency shell. That
# is exactly what the first boot of this medium did, and no amount of adjusting
# the kernel command line fixes it: `root=live:CDLABEL=…` is read by
# dmsquash-live, and `inst.stage2=…` by anaconda-dracut, and the initramfs on
# the ISO had neither.
#
# `ostree` is in the list because the payload is an ostree deployment and the
# initramfs has to be able to pivot into one.
add_dracutmodules+=" ostree dmsquash-live livenet qemu qemu-net "

# The medium is a virtual machine as often as it is hardware, and a
# host-only initramfs built inside a container image records the container's
# idea of the hardware — which is nobody's.
hostonly="no"
