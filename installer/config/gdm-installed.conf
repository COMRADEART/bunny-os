#
# GDM configuration for the INSTALLED system.
#
# DefaultSession is what a user who has never logged in gets. Without it GDM
# falls back to plain GNOME, where the Bunny extension is installed, enabled
# and inert — extension.js returns early unless BUNNY_SHELL_MODE is "normal",
# and only /usr/libexec/bunny-shell-session (the bunny.desktop Exec) sets
# that. Every qualification before Phase 3 logged in through harness-injected
# AccountsService records that chose the session explicitly, so the first
# *real* login was the first to discover the default was wrong.
#
# A user's own later choice still wins: GDM records it in AccountsService and
# reads it back in preference to this default.
[daemon]
DefaultSession=bunny.desktop

[security]

[xdmcp]

[chooser]

[debug]
