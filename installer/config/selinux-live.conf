# SELinux mode for the INSTALLATION MEDIUM only. The installed system is the
# payload image, which ships enforcing and is not touched by this file.
#
# Permissive here is what Fedora's own installer media do, and run 21 of
# Journey A is why: the installer's service-configuration step runs
# `systemctl enable <unit> --root=/mnt/sysroot` from a process confined by
# the medium's policy, against a freshly written target whose labels are
# still being established. Under enforcing that symlink creation is denied
# and the installation dies at "Error enabling service chronyd: 1" — after
# the disk has been erased. The same command, same binary, same deployment
# succeeds everywhere the policy is not enforcing.
#
# Permissive still labels files and still logs denials, so the medium loses
# no evidence — only the failure.
SELINUX=permissive
SELINUXTYPE=targeted
