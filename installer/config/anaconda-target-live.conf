# Anaconda target paths for the INSTALLATION MEDIUM.
#
# The medium is itself a bootc image, and on a bootc filesystem /mnt is a
# symlink to var/mnt. Anaconda's default target paths live under /mnt, and
# systemd's `systemctl enable --root=/mnt/sysroot` chases the root prefix
# with absolute-symlink re-rooting: the /mnt -> /var/mnt hop is re-rooted
# INSIDE the target, the composed path does not exist, and enable reports
# "Unit ... does not exist" for a unit that is right there. Everything that
# does not chase — ostree deploy, bootupd, list-unit-files — works through
# the symlink, which is why runs 18 through 23 died only at the
# service-enable step, after the disk was written.
#
# Captured by the failure replay on run 23:
#   Failed to enable unit: Unit chronyd.service does not exist
# with the target mounted, whole and healthy, at /var/mnt/sysroot.
#
# So the medium hands anaconda the real path, with no symlink in the middle.
[Installation Target]
physical_root = /var/mnt/sysimage
system_root = /var/mnt/sysroot
