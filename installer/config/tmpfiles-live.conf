# /run/anaconda must exist before bunny-anaconda-bus.service spawns:
# systemd opens StandardOutput=file: BEFORE it creates RuntimeDirectory=,
# measured under the image's own systemd as status=209/STDOUT with the
# directory never created at all - the stream setup dies first, so the
# RuntimeDirectory that would have satisfied it never happens.
d /run/anaconda 0755 root root -
