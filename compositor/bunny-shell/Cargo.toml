[package]
name = "bunny-shell"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
description = "Bunny OS experimental native Wayland shell (BUNNY WAYLAND SHELL EXPERIMENT - NOT RELEASE QUALIFIED - DO NOT USE AS THE DEFAULT SESSION)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "bunny-shell"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.7", features = [
    "backend_winit",
    "backend_egl",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xkbcommon = "0.8"
png = "0.17"

[profile.release]
opt-level = 2
debug = false
