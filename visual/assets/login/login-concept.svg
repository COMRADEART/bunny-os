  <rect width="1920" height="1080" fill="url(#bg)"/>
  <path d="M1410 80c0 380 100 650 350 880M1810 80c0 380-100 650-350 880" fill="none" stroke="#8B7CFF" stroke-opacity=".24" stroke-width="22" stroke-linecap="round"/>
