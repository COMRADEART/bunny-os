#
# Session autostart for the image-owned Hyprland path. Portal and status bar
# start here; Bunny user services remain under bunny-shell.target (started by
# the session wrapper before Hyprland execs).

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP BUNNY_SHELL_MODE BUNNY_DESKTOP_COMPOSITOR
exec-once = systemctl --user start xdg-desktop-portal-hyprland.service
exec-once = hyprpaper --config /usr/share/bunny-shell/hyprland/hyprpaper.conf
exec-once = waybar --config /usr/share/bunny-shell/hyprland/waybar/config.jsonc --style /usr/share/bunny-shell/hyprland/waybar/style.css
exec-once = hypridle
