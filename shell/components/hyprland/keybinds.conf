#
# Baseline binds only. Product keybind map (launcher, companion, trust) is a
# remaining product decision — see docs/HYPRLAND.md.

$mod = SUPER
$terminal = gnome-terminal
$launcher = wofi --show drun --prompt "Bunny"
$fileManager = nautilus

bind = $mod, Return, exec, $terminal
bind = $mod, Space, exec, $launcher
bind = $mod, E, exec, $fileManager
bind = $mod, Q, killactive,
# Fullscreen remains available; Adaptive Focus uses Super+F for layout instead.
bind = $mod SHIFT, Return, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, E, exit,

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bind = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Screenshot helpers (grim/slurp from hyprland package set).
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# Adaptive Hybrid layouts (Desktop / Focus / Studio). Presentation-only;
# task IDs and approvals are retained by bunny-adaptive-layout state.
# Focus/Studio also sync the GTK task rail (bunny-task-rail) via --apply.
bind = $mod, D, exec, bunny-adaptive-layout set desktop --apply
bind = $mod, F, exec, bunny-adaptive-layout set focus --apply
bind = $mod SHIFT, F, exec, bunny-adaptive-layout set studio --apply
bind = $mod, Tab, exec, bunny-adaptive-layout cycle --apply
# Ordinary desktop escape hatch (same as Desktop layout).
bind = $mod SHIFT, D, exec, bunny-adaptive-layout set desktop --apply
# Open the live task rail without changing layout (Focus/Studio only).
bind = $mod, R, exec, bunny-task-rail
