#
# Visual defaults aligned with shell/themes tokens (dark nocturne).
# Theme palette, blur intensity, and gaps remain user decisions — see
# docs/HYPRLAND.md.

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(7C3AEDff) rgba(A78BFAaa) 45deg
    col.inactive_border = rgba(FFFFFF10)
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(080B12aa)
    }
}

animations {
    enabled = true
    bezier = bunnyEase, 0.22, 1, 0.36, 1
    animation = windows, 1, 4, bunnyEase, popin 80%
    animation = windowsOut, 1, 4, bunnyEase, popin 80%
    animation = fade, 1, 3, bunnyEase
    animation = workspaces, 1, 4, bunnyEase, slide
}
