#
# Lightweight window rules. Companion/trust chrome layering uses declared
# app_ids where available; absolute placement is not claimed.

windowrulev2 = float, class:^(wofi)$
windowrulev2 = float, class:^(org.gnome.Nautilus)$
windowrulev2 = opacity 0.97 0.97, class:^(gnome-terminal-server)$|class:^(org.gnome.Terminal)$

# Adaptive Hybrid companion / task-rail surfaces (GTK app ids when present).
# Keep them floating and non-fullscreen so they cannot obscure lock/safe shell.
windowrulev2 = float, class:^(bunny-companion)$
windowrulev2 = float, class:^(bunny-task-rail)$
windowrulev2 = noblur, class:^(bunny-task-rail)$
windowrulev2 = pin, title:^(Bunny Trust)$

