#
# Wallpaper preload. The nocturne SVG is the design-system asset; hyprpaper
# may require a raster on some builds — solid misc:background_color remains the
# guaranteed fallback in hyprland.conf.

preload = /usr/share/backgrounds/bunny-os/bunny-nocturne.svg
wallpaper = ,/usr/share/backgrounds/bunny-os/bunny-nocturne.svg
splash = false
