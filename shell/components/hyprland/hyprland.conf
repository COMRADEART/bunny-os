#
# Image-owned Bunny Hyprland configuration. Loaded by
# /usr/libexec/bunny-hyprland-session via `Hyprland --config`.
# Edit modular files under this directory; do not fork a second compositor.

$bunnyConfig = /usr/share/bunny-shell/hyprland

source = $bunnyConfig/look-and-feel.conf
source = $bunnyConfig/input.conf
source = $bunnyConfig/keybinds.conf
source = $bunnyConfig/windowrules.conf
source = $bunnyConfig/autostart.conf

# Monitor defaults — override per-machine under ~/.config/hypr if needed.
monitor = ,preferred,auto,1

# Bunny dark nocturne fallback when wallpaper tooling is unavailable.
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(080B12)
    vfr = true
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

general {
    layout = dwindle
}
