[Unit]
# chronyd resolves User=chrony when it spawns. On this image the chrony
# account is not in /etc/passwd at all: it is in /usr/lib/passwd, the
# fedora-bootc base user database, and is resolved through the `altfiles`
# NSS source named in /etc/nsswitch.conf — which is a symlink to
# /etc/authselect/nsswitch.conf.
#
# authselect-apply-changes.service rewrites exactly that file on first boot.
# While it does, the `altfiles` source is not in effect, so the chrony
# account cannot be resolved even though nothing about chrony changed. When
# chronyd's spawn lands inside that window it exits 217/USER with
# "Failed to determine credentials for user 'chrony': Unknown user" and does
# not retry — chronyd.service declares no Restart=. Measured on 1 of 60
# control boots; the system then runs with no time synchronisation.
#
# nss-user-lookup.target is the systemd contract for "identity sources are
# settled", and authselect-apply-changes.service already declares
# Before=nss-user-lookup.target. Ordering after the target rather than after
# authselect alone means this stays correct on an image where authselect is
# absent or inapplicable: the target is passive, so it is simply reached at
# once and chronyd is not delayed. This is the same pattern upstream
# accounts-daemon.service uses for the same reason.
#
# Wants= is required, not decorative. nss-user-lookup.target is passive: no
# unit pulls it into the boot transaction by itself, and an After= on a unit
# that is not in the transaction orders nothing.
Wants=nss-user-lookup.target
After=nss-user-lookup.target

# Named as well as the target, because the target is what upstream units
# promise to be ordered before, while authselect-apply-changes.service is the
# unit whose window was actually measured. An After= on an absent unit is a
# no-op, so this costs nothing on images without authselect.
After=authselect-apply-changes.service
