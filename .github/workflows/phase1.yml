name: Bunny OS Phase 1 and 2

on:
  pull_request:
  push:
    branches: [main, feature/os-foundation, feature/bunny-shell]
  workflow_dispatch:
    inputs:
      full_image_gate:
        description: Run on a trusted self-hosted Fedora/KVM builder
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - name: Documentation, schema, units, scripts, and tests
        run: make gate-phase-2
      - name: Validate original architecture package
        shell: pwsh
        run: ./docs/phase-1/verify.ps1

  selinux-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile policy in Fedora 44
        run: >-
          docker run --rm -v "$PWD:/src:ro" fedora:44
          bash -lc 'dnf -y install make selinux-policy-devel policycoreutils-devel &&
          cp /src/selinux/bunny_os.te /src/selinux/bunny_os.fc /tmp/ &&
          cd /tmp && make -f /usr/share/selinux/devel/Makefile bunny_os.pp'

  systemd-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The verification script installs the programs the image build installs,
      # so systemd-analyze resolves ExecStart= against the layout the image
      # actually produces rather than against a bare container.
      - name: Verify installed-form units and record offline security reports
        run: >-
          docker run --rm -v "$PWD:/src:ro" fedora:44
          bash -lc 'dnf -y install systemd polkit python3 &&
          bash /src/build/scripts/ci-verify-units.sh /src'

  gnome-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Session entries and application launchers obey different specifications
      # and are validated separately; see the script for why.
      - name: Validate GNOME 50 extension, schemas, and desktop entries in Fedora 44
        run: >-
          docker run --rm -v "$PWD:/src:ro" fedora:44
          bash -lc 'dnf -y install glib2 desktop-file-utils gnome-shell python3 &&
          bash /src/build/scripts/ci-validate-desktop.sh /src'

  # Phases 3, 5 and 7 had no CI coverage: only gate-phase-2 ran, so an installer,
  # operations or Phase 7 regression could merge unnoticed.
  installer-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - name: Installer and application distribution gate
        run: |
          python scripts/task.py installer-audit
          python scripts/task.py test-installer
          python scripts/task.py test-storage
          python scripts/task.py test-encryption
          python scripts/task.py test-first-run
          python scripts/task.py test-app-distribution
          python scripts/task.py test-installer-security

  operations-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema pyyaml
      - name: Phase 5 operations and stable-qualification tooling
        run: |
          python scripts/task.py phase5-audit
          python scripts/phase5.py baseline
          python scripts/task.py test-phase5
          python scripts/phase5.py source-gate
          python scripts/phase5.py long-run-plan
      - name: Protected gates must stay closed
        run: |
          # Exit 2 exactly. Accepting any non-zero status would let a traceback
          # or a missing evidence file pass as a correct refusal.
          bash build/scripts/assert-gate.sh 2 "phase 5 stable gate" -- \
            python scripts/phase5.py stable-gate --evidence operations/data/stable-qualification.json

  phase7-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation and cryptography dependencies
        run: python -m pip install --disable-pip-version-check jsonschema cryptography pyyaml
      - name: Phase 7 source gate
        run: |
          python scripts/task.py validate
          python scripts/task.py phase7-audit
          python scripts/phase7.py baseline
          for area in oem factory device-identity enrolment policy fleet multitenancy \
                      sync sync-crypto device-revocation remote-wipe airgap kiosk decommission pilot; do
            python scripts/task.py "test-$area"
          done
          python scripts/phase7.py source-gate
      - name: Pilot gates must stay closed
        run: |
          set -euo pipefail
          for kind in oem enterprise sync; do
            bash build/scripts/assert-gate.sh 2 "$kind pilot gate" -- \
              python scripts/phase7.py pilot-gate --kind "$kind"
          done
          echo "all three pilot gates correctly report BLOCKED"

  full-image-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.full_image_gate
    runs-on: [self-hosted, linux, x64, bunny-os-image-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Full privileged artifact gate
        env:
          FULL_GATE: "1"
          BUNNY_BASE_IMAGE: ${{ vars.BUNNY_BASE_IMAGE_PINNED }}
        run: make gate-phase-2
      - name: Upload unsigned validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: bunny-os-phase2-evidence
          path: build/out/
          retention-days: 14
