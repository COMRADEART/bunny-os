name: Bunny OS Phase 1 and 2

on:
  pull_request:
  push:
    branches: [main, feature/os-foundation, feature/bunny-shell]
  workflow_dispatch:
    inputs:
      full_image_gate:
        description: Run on a trusted self-hosted Fedora/KVM builder
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Documentation, schema, units, scripts, and tests
        run: make gate-phase-2
      - name: Validate original architecture package
        shell: pwsh
        run: ./docs/phase-1/verify.ps1

  selinux-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile policy in Fedora 44
        run: >-
          docker run --rm -v "$PWD:/src:ro" fedora:44
          bash -lc 'dnf -y install make selinux-policy-devel policycoreutils-devel &&
          cp /src/selinux/bunny_os.te /src/selinux/bunny_os.fc /tmp/ &&
          cd /tmp && make -f /usr/share/selinux/devel/Makefile bunny_os.pp'

  systemd-units:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify installed-form units and record offline security reports
        run: >-
          docker run --rm -v "$PWD:/src:ro" fedora:44
          bash -lc 'dnf -y install systemd polkit &&
          cp /src/systemd/*.service /src/systemd/*.socket /src/systemd/*.timer /src/systemd/*.target /etc/systemd/system/ &&
          cp /src/systemd/user/*.service /src/systemd/user/*.timer /src/systemd/user/*.target /etc/systemd/user/ &&
          install -m 0755 /src/services/bunny-system-broker/bin/bunny-system-broker /usr/libexec/bunny-system-broker &&
          install -m 0755 /src/services/bunny-update-agent/bunny_update_agent.py /usr/libexec/bunny-update-agent &&
          for name in bunny-health-check bunny-recovery-prepare bunny-recovery; do install -m 0755 "/src/scripts/${name}.py" "/usr/libexec/${name}"; done &&
          install -m 0755 /src/scripts/bunny-first-boot.py /usr/libexec/bunny-first-boot &&
          install -m 0755 /src/shell/services/bin/bunny-shell-service /usr/libexec/bunny-shell-service &&
          for name in bunny-search bunny-launcher bunny-workspace bunny-settings bunny-terminal; do install -m 0755 "/src/shell/services/bin/${name}" "/usr/bin/${name}"; done &&
          mkdir -p /opt/bunny/current && install -m 0755 /usr/bin/true /opt/bunny/current/bunny-desktop &&
          systemd-analyze verify /etc/systemd/system/bunny-* /etc/systemd/user/bunny-* &&
          systemd-analyze security --offline=yes bunny-system-broker.service bunny-update-agent@check.service bunny-health-check.service bunny-recovery-prepare.service'

  gnome-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate GNOME 50 extension, schemas, and desktop entries in Fedora 44
        run: >-
          docker run --rm -v "$PWD:/src:ro" fedora:44
          bash -lc 'dnf -y install glib2 desktop-file-utils gnome-shell &&
          cp -a /src/shell/components/gnome-shell-extension /tmp/bunny-shell@bunny-os.org &&
          glib-compile-schemas --strict /tmp/bunny-shell@bunny-os.org/schemas &&
          desktop-file-validate /src/shell/session/*.desktop /src/shell/components/applications/*.desktop &&
          gnome-extensions pack --force --out-dir=/tmp /tmp/bunny-shell@bunny-os.org'

  # Phases 3, 5 and 7 had no CI coverage: only gate-phase-2 ran, so an installer,
  # operations or Phase 7 regression could merge unnoticed.
  installer-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema
      - name: Installer and application distribution gate
        run: |
          python scripts/task.py installer-audit
          python scripts/task.py test-installer
          python scripts/task.py test-storage
          python scripts/task.py test-encryption
          python scripts/task.py test-first-run
          python scripts/task.py test-app-distribution
          python scripts/task.py test-installer-security

  operations-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check jsonschema
      - name: Phase 5 operations and stable-qualification tooling
        run: |
          python scripts/task.py phase5-audit
          python scripts/phase5.py baseline
          python scripts/task.py test-phase5
          python scripts/phase5.py source-gate
          python scripts/phase5.py long-run-plan
      - name: Protected gates must stay closed
        run: |
          if python scripts/phase5.py stable-gate --evidence operations/data/stable-qualification.json; then
            echo "::error::the stable gate reported GO; publication must not be unblocked by CI"
            exit 1
          fi
          echo "stable gate correctly reports NO-GO"

  phase7-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation and cryptography dependencies
        run: python -m pip install --disable-pip-version-check jsonschema cryptography
      - name: Phase 7 source gate
        run: |
          python scripts/task.py validate
          python scripts/task.py phase7-audit
          python scripts/phase7.py baseline
          for area in oem factory device-identity enrolment policy fleet multitenancy \
                      sync sync-crypto device-revocation remote-wipe airgap kiosk decommission pilot; do
            python scripts/task.py "test-$area"
          done
          python scripts/phase7.py source-gate
      - name: Pilot gates must stay closed
        run: |
          for kind in oem enterprise sync; do
            if python scripts/phase7.py pilot-gate --kind "$kind"; then
              echo "::error::the $kind pilot gate reported GO; pilots must not be unblocked by CI"
              exit 1
            fi
          done
          echo "all three pilot gates correctly report BLOCKED"

  full-image-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.full_image_gate
    runs-on: [self-hosted, linux, x64, bunny-os-image-builder]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Full privileged artifact gate
        env:
          FULL_GATE: "1"
          BUNNY_BASE_IMAGE: ${{ vars.BUNNY_BASE_IMAGE_PINNED }}
        run: make gate-phase-2
      - name: Upload unsigned validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: bunny-os-phase2-evidence
          path: build/out/
          retention-days: 14
