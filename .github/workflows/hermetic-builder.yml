name: Hermetic builder (H1/H2)

# A hosted, independently administered *hermetic* build of the qualification
# target.
#
# The existing independent-builder workflow resolves its packages from live
# repositories and pulls its base from wherever the reference points. That was
# the right thing when there was nothing else, and it is not comparable to a
# local hermetic build: two builders resolving their own package sets from a
# moving repository are measuring the repository.
#
# This one fetches the three published inputs by digest, puts each where its lock
# says it lives, and runs the same build script the local builder runs, with the
# same BUNNY_HERMETIC_BUILD=1. A build that took a different route to its inputs
# on one builder would be a different build.
#
# It asserts the commit is the qualification target before it starts. A runner
# pointed at the wrong commit would otherwise produce a perfectly good artifact
# of something nobody asked for, and the comparison would report a
# reproducibility failure that is really a dispatch mistake.
#
# The `label` input distinguishes H1 from H2. It is recorded in the evidence and
# changes nothing about the build: two runs that differed because they were
# labelled differently would be the defect this workflow exists to detect.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-character SHA of the qualification target (Commit C)
        required: true
        type: string
      label:
        description: Which hosted build this is
        required: true
        default: H1
        type: choice
        options: [H1, H2]
      profile:
        description: Image profile
        required: true
        default: beta
        type: choice
        options: [beta]

permissions:
  contents: read
  packages: read

env:
  # The exact interpreter the local builder runs, not a floating minor. The
  # host python is classified output-affecting — the shipped archive passes
  # through its tarfile during normalisation — so the independence evaluator
  # requires the pair to match, and "3.13" was a version the local builder
  # never had.
  PYTHON_VERSION: "3.14.3"
  BUNNY_ARCHIVE_ONLY: "1"
  BUNNY_CACHES_DISABLED: "1"

jobs:
  guard:
    name: Guard — target and no signing access
    runs-on: ubuntu-24.04
    steps:
      - name: Reject a non-exact commit reference
        run: |
          commit='${{ inputs.commit }}'
          if ! printf '%s' "$commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit must be a full 40-character SHA; a branch name does not pin a build"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ''
      - name: The commit must be the qualification target it claims to be
        run: python scripts/supply-chain/assert-target-commit.py --commit '${{ inputs.commit }}'
      - name: No production signing secret may be reachable
        env:
          BUNNY_OS_RELEASE_KEY: ${{ secrets.BUNNY_OS_RELEASE_KEY }}
          BUNNY_RECOVERY_KEY: ${{ secrets.BUNNY_RECOVERY_KEY }}
          BUNNY_UPDATE_KEY: ${{ secrets.BUNNY_UPDATE_KEY }}
          BUNNY_CATALOGUE_KEY: ${{ secrets.BUNNY_CATALOGUE_KEY }}
        run: |
          for name in BUNNY_OS_RELEASE_KEY BUNNY_RECOVERY_KEY BUNNY_UPDATE_KEY BUNNY_CATALOGUE_KEY; do
            if [ -n "${!name:-}" ]; then
              echo "::error::$name is reachable; qualification builds must be unsigned"
              exit 1
            fi
          done
          echo "no production signing secret is reachable"

  build:
    name: Hermetic build ${{ inputs.label }}
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: ''

      - name: Install podman, skopeo and syft
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman skopeo runc fuse-overlayfs
          # podman is pinned by the builder lock, like syft below. Ubuntu's
          # archive podman (4.9) predates --source-date-epoch and
          # --rewrite-timestamp, which the build requires — the first hosted
          # run to reach `podman build` failed on exactly that flag — and a
          # version the lock does not name is not the pinned toolchain anyway:
          # layer packing is the tool's output, and two podmans are two tools.
          # The apt install above stays for its dependencies and configs; the
          # static bundle in front of it on PATH is what runs.
          podman_version="$(python -c "
          import json
          lock = json.load(open('build/inputs/builder-image-lock.json'))
          print(next(t['version'] for t in lock['tools'] if t['name'] == 'podman'))
          ")"
          curl -fsSL -o /tmp/podman-static.tar.gz \
            "https://github.com/mgoltzsche/podman-static/releases/download/v${podman_version}/podman-linux-amd64.tar.gz"
          # The digest of the v5.8.4 linux-amd64 asset. A lock bump changes the
          # URL above and fails this check loudly, which is the point: the new
          # digest is recorded here deliberately, not discovered in a green run.
          echo "a58765fe8be6ab3fb79f892f1a027b4ce4a7e8eb589df1ef960c167cbde08d69  /tmp/podman-static.tar.gz" \
            | sha256sum --check
          sudo tar -C / --strip-components=1 -xzf /tmp/podman-static.tar.gz \
            podman-linux-amd64/usr podman-linux-amd64/etc
          actual="$(podman --version | awk '{print $3}')"
          if [ "${actual}" != "${podman_version}" ]; then
            echo "::error::podman is ${actual} but the builder lock pins ${podman_version}"
            exit 1
          fi
          echo "podman pinned to ${podman_version} from the builder lock"
          # skopeo is classified output-affecting — it copies the base into
          # and out of retention — so the independence evaluator requires both
          # builders to run the same version. Ubuntu's archive carries 1.13;
          # the lock pins 1.22.2. Built from the upstream tag with the openpgp
          # tag so no gpgme system dependency enters, and asserted against the
          # lock the same way podman is.
          skopeo_version="$(python -c "
          import json
          lock = json.load(open('build/inputs/builder-image-lock.json'))
          print(next(t['version'] for t in lock['tools'] if t['name'] == 'skopeo'))
          ")"
          git clone --quiet --depth 1 --branch "v${skopeo_version}" \
            https://github.com/containers/skopeo /tmp/skopeo-src
          make -C /tmp/skopeo-src bin/skopeo \
            BUILDTAGS='containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper' \
            >/dev/null
          sudo install /tmp/skopeo-src/bin/skopeo /usr/local/bin/skopeo
          actual_skopeo="$(skopeo --version | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)"
          if [ "${actual_skopeo}" != "${skopeo_version}" ]; then
            echo "::error::skopeo is ${actual_skopeo} but the builder lock pins ${skopeo_version}"
            exit 1
          fi
          echo "skopeo pinned to ${skopeo_version} from the builder lock"
          # syft is pinned by the builder lock; the version installed here must
          # match it or the SBOM dimension compares two tools rather than two
          # images.
          version="$(python -c "
          import json
          lock = json.load(open('build/inputs/builder-image-lock.json'))
          print(next(t['version'] for t in lock['tools'] if t['name'] == 'syft'))
          ")"
          curl -fsSL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "v${version}"
          syft version
          echo "syft pinned to ${version} from the builder lock"

      - name: Reclaim disk and add swap
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules /usr/share/swift || true
          sudo apt-get clean
          df -h /
          # syft catalogues a 1.85 GB archive holding 165,000 entries on a 16 GiB
          # runner and was killed for memory once with 28 GiB of disk still free.
          sudo fallocate -l 16G /swapfile-bunny
          sudo chmod 600 /swapfile-bunny
          sudo mkswap /swapfile-bunny
          sudo swapon /swapfile-bunny
          free -h

      - name: Use the kernel's native overlay diff
        run: |
          set -euo pipefail
          # Ubuntu boots overlayfs with redirect_dir=Y, and containers/storage
          # answers that with its naive diff walker. The local Fedora builder
          # defaults to N and gets the native upperdir reader. Same content,
          # two byte streams: naive synthesizes an independent whiteout per
          # deleted path where native emits the upperdir's opaque marker and
          # hardlinked whiteouts, and naive orders members as a flat sorted
          # list where native walks the tree. Measured on attempt 4 as the
          # entire remaining difference between the local and hosted archives
          # — one opaque entry, whiteout link shape, and member order in the
          # two layers this build writes. The parameter is runtime-writable,
          # so the runner is turned to match the local builder before any
          # store exists.
          sudo modprobe overlay 2>/dev/null || true
          echo N | sudo tee /sys/module/overlay/parameters/redirect_dir
          if [ -f /sys/module/overlay/parameters/metacopy ]; then
            echo N | sudo tee /sys/module/overlay/parameters/metacopy
          fi

      - name: Configure the container runtime
        run: |
          set -euo pipefail
          # crun, from the same pinned static bundle as podman — the local
          # builder runs crun, and the earlier runc override existed only
          # because Ubuntu's apt crun refused the OCI spec Ubuntu's apt podman
          # wrote, a mismatch the pinned bundle does not have. podman still
          # falls back to the vfs storage driver without an explicit one,
          # which copies the whole image per layer, so the driver stays
          # explicit. Neither is a build input: the image content is
          # determined by the Containerfile, the base digest and the source
          # commit.
          # By absolute path: a bare "crun" resolves through podman's own
          # runtime search list, which found Ubuntu's apt crun 1.14 ahead of
          # the pinned one and failed with "crun: unknown version specified" —
          # the 1.14 runtime refusing the OCI spec podman 5.8 writes. The name
          # alone does not pin the binary.
          sudo install -d /etc/containers
          printf '[engine]\nruntime = "crun"\n\n[engine.runtimes]\ncrun = ["/usr/local/bin/crun"]\n' \
            | sudo tee /etc/containers/containers.conf
          /usr/local/bin/crun --version | head -1
          printf '[storage]\ndriver = "overlay"\nrunroot = "/run/containers/storage"\ngraphroot = "/var/lib/containers/storage"\n' \
            | sudo tee /etc/containers/storage.conf
          sudo rm -rf /var/lib/containers/storage /run/containers/storage
          sudo podman info --format 'runtime={{.Host.OCIRuntime.Name}} {{.Host.OCIRuntime.Version}}'

      - name: Authenticate to the registry, read-only
        run: |
          set -euo pipefail
          echo '${{ secrets.GITHUB_TOKEN }}' \
            | skopeo login --username '${{ github.actor }}' --password-stdin ghcr.io >/dev/null

      - name: Fetch the retained inputs by digest and put them where the locks say
        run: |
          set -euo pipefail
          sudo mkdir -p /var/lib/bunny-retention
          sudo chown "$(id -u):$(id -g)" /var/lib/bunny-retention
          python scripts/supply-chain/hydrate-retained-inputs.py \
            --publication build/inputs/input-publication-lock.json \
            --report build/out/qualification/hydrated-inputs.json

      - name: Verify every input lock against what was fetched
        run: python scripts/supplychain.py verify-input-locks

      - name: Record the runner environment
        id: environment
        run: |
          set -euo pipefail
          mkdir -p build/out/ci
          {
            echo "label=${{ inputs.label }}"
            echo "runnerImage=${ImageOS:-unknown}"
            echo "runnerName=${RUNNER_NAME:-unknown}"
            echo "kernel=$(uname -r)"
            echo "containerRuntime=$(podman --version)"
            echo "workflowRunId=${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          } | tee build/out/ci/runner-environment.txt
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build hermetically
        env:
          BUNNY_HERMETIC_BUILD: "1"
          BUNNY_RELEASE_BUILD: "0"
        run: |
          set -euo pipefail
          bash build/scripts/build-image.sh '${{ inputs.profile }}' 2>&1 \
            | tee build/out/ci/build.log

      - name: Generate the SBOM
        run: |
          set -euo pipefail
          profile='${{ inputs.profile }}'
          export TMPDIR="${RUNNER_TEMP}/syft"
          # The SBOM lives in build/out/ci, not in the profile directory: the
          # artifact manifest below is `sha256sum -- *` over the profile
          # directory, and a subdirectory there would break it.
          mkdir -p "$TMPDIR" build/out/ci
          export SYFT_PARALLELISM=1
          syft "oci-archive:build/out/${profile}/bunny-os.oci.tar" \
            -o "spdx-json=build/out/ci/sbom.spdx.json"

      - name: Inventory the layers
        run: |
          set -euo pipefail
          # Per-layer compressed and uncompressed digests, plus ordered entry
          # metadata for the layers this build itself wrote. When two builders'
          # blobs differ, this is what says whether the difference is bytes,
          # metadata, member order or only compression — without shipping a
          # 1.8 GB archive to find out.
          python - "build/out/${{ inputs.profile }}/bunny-os.oci.tar" build/out/ci/layer-inventory.json 3 <<'PY'
          import gzip, hashlib, json, sys, tarfile
          archive, output, detail_last = sys.argv[1], sys.argv[2], int(sys.argv[3])
          outer = tarfile.open(archive)
          index = json.load(outer.extractfile("index.json"))
          manifest_digest = index["manifests"][0]["digest"].split(":")[1]
          manifest = json.load(outer.extractfile(f"blobs/sha256/{manifest_digest}"))
          layers = [l["digest"].split(":")[1] for l in manifest["layers"]]
          report = {"layers": []}
          for position, blob in enumerate(layers):
              fh = outer.extractfile(f"blobs/sha256/{blob}")
              head = fh.read(2)
              fh = outer.extractfile(f"blobs/sha256/{blob}")
              raw = gzip.open(fh) if head == b"\x1f\x8b" else fh
              entries = []
              inner = tarfile.open(fileobj=raw, mode="r|")
              count = 0
              for member in inner:
                  count += 1
                  if position >= len(layers) - detail_last:
                      entries.append({
                          "name": member.name, "type": member.type.decode(),
                          "size": member.size, "mtime": member.mtime,
                          "mode": member.mode, "uid": member.uid, "gid": member.gid,
                          "linkname": member.linkname,
                          "paxXattrs": sorted(k for k in (member.pax_headers or {})),
                      })
              digest = hashlib.sha256()
              fh = outer.extractfile(f"blobs/sha256/{blob}")
              head = fh.read(2)
              fh = outer.extractfile(f"blobs/sha256/{blob}")
              raw = gzip.open(fh) if head == b"\x1f\x8b" else fh
              while True:
                  chunk = raw.read(1024 * 1024)
                  if not chunk:
                      break
                  digest.update(chunk)
              record = {
                  "position": position,
                  "compressed": blob,
                  "uncompressed": digest.hexdigest(),
                  "entryCount": count,
                  "gzip": head == b"\x1f\x8b",
              }
              if position >= len(layers) - detail_last:
                  record["entries"] = entries
              report["layers"].append(record)
          with open(output, "w", encoding="utf-8") as handle:
              json.dump(report, handle, indent=1, sort_keys=True)
          print(f"wrote {output}: {len(layers)} layers, detail on last {detail_last}")
          PY

      - name: Collect the intended SELinux manifest
        run: |
          set -euo pipefail
          sudo apt-get install --yes --no-install-recommends policycoreutils || true
          python scripts/reproducibility/collect_intended_selinux.py \
            --archive "build/out/${{ inputs.profile }}/bunny-os.oci.tar" \
            --output "build/out/ci/intended-selinux.json"

      - name: Collect every archive-stage dimension, in qualification mode
        run: |
          set -euo pipefail
          profile='${{ inputs.profile }}'
          epoch="$(python -c "
          import json
          print(json.load(open('build/inputs/reproducibility-lock.json'))['sourceDateEpoch'])
          ")"
          python scripts/reproducibility/collect_comparison_dimensions.py \
            --archive "build/out/${profile}/bunny-os.oci.tar" \
            --sbom build/out/ci/sbom.spdx.json \
            --normalisation "build/out/${profile}/normalisation.json" \
            --epoch "$epoch" \
            --mode qualification \
            --output build/out/ci/dimensions.json

      - name: Extract the package databases for direct comparison
        run: |
          set -euo pipefail
          python scripts/reproducibility/extract_archive_paths.py \
            --archive "build/out/${{ inputs.profile }}/bunny-os.oci.tar" \
            --path usr/share/rpm/rpmdb.sqlite \
            --path usr/lib/sysimage/libdnf5/transaction_history.sqlite \
            --destination build/out/ci/databases \
            --manifest build/out/ci/databases/extraction.json \
            --require-all

      - name: Collect the builder record
        run: |
          set -euo pipefail
          # The record must pin the base the build actually consumed. The
          # published digest reference is that pin; an empty or tag-only value
          # is refused at import, and both builders must record the same one.
          BUNNY_BASE_IMAGE="$(python -c "
          import json
          lock = json.load(open('build/inputs/input-publication-lock.json'))
          print(lock['inputs']['base']['digestReference'])
          ")"
          export BUNNY_BASE_IMAGE
          python scripts/reproducibility/collect_builder_record.py builder-record \
            --builder-id "hosted-${{ inputs.label }}-${GITHUB_RUN_ID}" \
            --builder-type hosted-ci \
            --started-at '${{ steps.environment.outputs.started }}' \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --output build/out/ci/builder-record.json

      - name: Collect what the evidence import requires
        run: |
          set -euo pipefail
          profile='${{ inputs.profile }}'
          # release/hosted.py refuses a bundle missing any of its required
          # artifacts, and the first hosted attempts uploaded a bundle that
          # could never have been imported. Everything named there is produced
          # here, the same way the independent-builder workflow produces it.
          python - <<'PY'
          import json, pathlib
          document = json.loads(pathlib.Path("build/out/ci/sbom.spdx.json").read_text(encoding="utf-8"))
          entries = sorted(
              f"{item.get('name')}@{item.get('versionInfo', 'UNKNOWN')}"
              for item in document.get("packages", [])
          )
          pathlib.Path("build/out/ci/package-inventory.txt").write_text(
              "\n".join(entries) + "\n", encoding="utf-8"
          )
          print(f"{len(entries)} package entries")
          PY
          # The bundle's normalisation.json is the operator-side pass over the
          # shipped archive, so its rawDigest matches the artifact manifest's
          # entry for bunny-os.oci.tar. The build's own normalisation.json
          # records the pre-shipping normalisation and stays where it is.
          python scripts/release.py normalise-artifact \
            --source "build/out/${profile}/bunny-os.oci.tar" \
            --destination build/out/ci/bunny-os.normalised.tar \
            --output build/out/ci/normalisation.json
          rm -f build/out/ci/bunny-os.normalised.tar
          BUNNY_BASE_IMAGE="$(python -c "
          import json
          lock = json.load(open('build/inputs/input-publication-lock.json'))
          print(lock['inputs']['base']['digestReference'])
          ")"
          export BUNNY_BASE_IMAGE
          python scripts/reproducibility/collect_builder_record.py provenance \
            --profile "$profile" \
            --artifact-dir "build/out/${profile}" \
            --output build/out/ci/ci-provenance.json
          ( cd "build/out/${profile}" && sha256sum -- * > "${GITHUB_WORKSPACE}/build/out/ci/artifact-manifest.sha256" )
          cat build/out/ci/artifact-manifest.sha256

      - name: Upload the comparison evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermetic-${{ inputs.label }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 90
          path: |
            build/out/ci/dimensions.json
            build/out/ci/intended-selinux.json
            build/out/ci/builder-record.json
            build/out/ci/runner-environment.txt
            build/out/ci/hydrated-inputs.json
            build/out/qualification/hydrated-inputs.json
            build/out/ci/databases/**
            build/out/ci/layer-inventory.json
            build/out/ci/sbom.spdx.json
            build/out/ci/package-inventory.txt
            build/out/ci/ci-provenance.json
            build/out/ci/artifact-manifest.sha256
            build/out/ci/normalisation.json
            build/out/ci/build.log
            build/out/${{ inputs.profile }}/normalisation.json
            build/out/${{ inputs.profile }}/provenance.json
            build/out/${{ inputs.profile }}/SHA256SUMS

      - name: Assert no gate moved
        run: |
          set -euo pipefail
          bash build/scripts/assert-gate.sh 2 "stable release after a hosted hermetic build" -- python scripts/release.py gate --kind stable-release
          bash build/scripts/assert-gate.sh 2 "qualification candidate after a hosted hermetic build" -- python scripts/release.py gate --kind qualification-candidate
