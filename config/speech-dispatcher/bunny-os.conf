#
# Bound Speech Dispatcher's log. Read through the `Include "clients/*.conf"`
# at the end of the shipped /etc/speech-dispatcher/speechd.conf, so the RPM's
# own file is left exactly as it was packaged.
#
# Why this exists, measured rather than assumed. Speech Dispatcher's default
# LogLevel is 3, and at level 3 it writes every line of every response it
# sends. The response to `spd-say --list-synthesis-voices` is the full
# language x voice matrix — several thousand lines of
# `LINE here:|200-Afrikaans+Iven3  af  Iven3|` — and the companion's voice
# provider asks for it whenever it builds a declaration, which is once per
# process that wants to know whether a voice exists.
#
# The log lives in /run/user/$UID/speech-dispatcher/log/, which is a tmpfs and
# therefore RAM. On the qualification host it reached **1,656,115,200 bytes**
# — 1.6 GiB — and filled /run/user/0 completely, at which point the next
# `podman build` failed with "No space left on device" writing its container
# configuration. That is the failure this was found by; the failure it would
# have caused on a user's machine is the companion's own socket directory,
# /run/user/$UID/bunny-companion, having nowhere to go.
#
# LogLevel 1 keeps errors and drops the transcript of every response. It is a
# bound rather than a silence: a Speech Dispatcher that cannot start still says
# so, which is what the voice diagnostics read.
LogLevel  1
