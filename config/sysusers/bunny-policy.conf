#
# The policy agent runs as this account. systemd-sysusers writes it into
# /etc/passwd (the files NSS source), not /usr/lib/passwd, so it is not
# exposed to the altfiles rewrite window that chronyd hits.
#
# UID/GID 471 matches the factory inspection fixture.
u bunny-policy 471:471 "Bunny OS policy agent" / /usr/sbin/nologin
