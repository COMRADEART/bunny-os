# Bunny OS per-user directories, created by the user manager's
# systemd-tmpfiles-setup.service before basic.target.
#
# Installed to /usr/share/user-tmpfiles.d/. That path is deliberate and was
# measured, not assumed: systemd's --user mode reads user-tmpfiles.d from the
# XDG data and config search paths, and /usr/lib/user-tmpfiles.d is NOT among
# them (tmpfiles.d(5); confirmed absent and unread on fedora-bootc:44). A rule
# placed in /usr/lib/user-tmpfiles.d is a silent no-op.
#
# Both paths below are named as ReadWritePaths= by bunny-first-boot.service
# under ProtectHome=read-only. A ReadWritePaths= path that does not exist
# fails mount-namespace setup with 226/NAMESPACE before ExecStart, which is
# how that unit failed on 60 of 60 fresh homes. They must exist before the
# unit starts, for every user, including one whose account predates this rule.
#
# The owner and group columns are '-' so tmpfiles uses the invoking user: in
# --user mode there is no other correct answer, and naming a literal user
# would bake a test identity into the image.

d %h/.config/bunny-os 0700 - - -
d %h/.config/systemd/user 0700 - - -

# The capsule and trust state roots. bunny-companion.service names both as
# ReadWritePaths= under ProtectHome=read-only, and a ReadWritePaths= path that
# does not exist fails mount-namespace setup with 226/NAMESPACE before
# ExecStart - the same failure the two rules above exist to prevent. The
# runtime creates everything beneath them itself.
d %h/.local/share/bunny 0700 - - -
d %h/.local/state/bunny 0700 - - -

# bunny-first-run.service's sandbox root: ReadWritePaths=%S/bunny-os, where
# the applied-state record, the resumable wizard state and the
# first-run-complete marker all live. Stage 2 recorded the unit "failed on
# the session" without a mechanism, and this is the mechanism the comment
# above describes: 226/NAMESPACE before ExecStart, for every user.
d %h/.local/state/bunny-os 0700 - - -

# bunny-desktop.service's remaining grants. Found by the Phase 3 test that
# checks every user unit's home-relative ReadWritePaths= against this file —
# the same class as the two above, latent because something else usually
# created the directories before the unit's first start on a lived-in home.
d %h/.config/bunny 0700 - - -
d %h/.cache/bunny 0700 - - -
