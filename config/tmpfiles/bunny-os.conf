d /run/bunny 0755 root root -
d /var/lib/bunny-os 0711 root root -
d /var/lib/bunny-os/update 0700 root root -
d /var/lib/bunny-os/recovery 0700 root root -
d /var/lib/bunny-os/health 0700 root root -
d /var/lib/bunny-os/support 0711 root root 14d
d /var/lib/bunny 0711 root root -
d /var/cache/bunny 0711 root root 30d
d /var/log/bunny 0750 root systemd-journal 14d

# The capability control plane's state. Modes are load-bearing, not decorative:
#
#   capability/      0700  approval records name what a user was asked and what
#                          they answered, and reservation records are the
#                          accounting the applicator trusts. Neither is
#                          world-readable and neither is world-writable.
#   audit            0750  readable by systemd-journal for collection, bounded
#                          at 14 days like the rest of Bunny OS's logs.
#
# /run/bunny-os/capability is NOT declared here: the supervisor unit's
# RuntimeDirectory= creates it, which means systemd owns its lifetime and
# removes it on stop. Declaring it in both places would leave a stale directory
# after the unit stops, and a stale lock file in it.
d /var/lib/bunny-os/capability 0700 root root -
d /var/log/bunny-os 0750 root systemd-journal 14d
